<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e12">
  <title>Rodas Garage | Catálogo</title>
  <style>
    :root {
      --bg: #0b0e12;
      --panel: #131820;
      --panel-2: #191f29;
      --line: #29313d;
      --text: #f4f6f8;
      --muted: #9ca7b5;
      --accent: #e9b84b;
      --accent-2: #ffda7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #18202b 0, var(--bg) 48%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .wrap {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 34px 0 24px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--accent-2), #bd8422);
      color: #17130b;
      font-size: 24px;
      box-shadow: 0 8px 28px rgba(233, 184, 75, .18);
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 11px;
      font-weight: 800;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(25px, 4vw, 38px);
      letter-spacing: -.04em;
    }

    .subtitle {
      color: var(--muted);
      margin: 14px 0 0;
      max-width: 650px;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 24px 0;
      align-items: center;
    }

    .search {
      flex: 1 1 260px;
      position: relative;
    }

    .search input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      outline: none;
    }

    .search input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 184, 75, .12);
    }

    select {
      width: auto;
      min-width: 170px;
      cursor: pointer;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      margin-left: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding-bottom: 44px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: linear-gradient(180deg, #171d26, #11161d);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(233, 184, 75, .65);
      box-shadow: 0 16px 36px rgba(0, 0, 0, .22);
    }

    .photo {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow: hidden;
      background: radial-gradient(circle, #2a323e, #141920 70%);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .photo .placeholder {
      color: #758192;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .info {
      padding: 15px 16px 17px;
    }

    .tag {
      display: inline-block;
      color: var(--accent-2);
      background: rgba(233, 184, 75, .1);
      border: 1px solid rgba(233, 184, 75, .22);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .info h2 {
      font-size: 16px;
      margin: 11px 0 0;
      line-height: 1.35;
    }

    .description {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .empty {
      display: none;
      padding: 48px 20px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      margin-bottom: 42px;
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, .07);
      color: var(--muted);
      padding: 22px 0 30px;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .wrap {
        width: min(100% - 22px, 1200px);
      }

      header {
        padding-top: 25px;
      }

      select {
        flex: 1;
      }

      .count {
        width: 100%;
        margin-left: 0;
      }

      .info {
        padding: 12px;
      }
    }

    @media (max-width: 390px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .photo {
        aspect-ratio: 1.15 / 1;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="eyebrow">Catálogo de acessórios</div>
          <h1>Rodas <span style="color:var(--accent)">Garage</span></h1>
        </div>
      </div>
      <p class="subtitle">Explore o catálogo de rodas. Use a pesquisa ou filtre por categoria para encontrar o modelo
        desejado.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="Filtros do catálogo">
      <label class="search">
        <input id="search" type="search" placeholder="Pesquisar roda pelo nome..."
          aria-label="Pesquisar roda pelo nome">
      </label>
      <select id="category" aria-label="Filtrar por categoria">
        <option value="todas">Todas as categorias</option>
      </select>
      <div class="count" id="count" aria-live="polite">0 rodas</div>
    </section>

    <section class="grid" id="grid" aria-label="Rodas cadastradas"></section>
    <div class="empty" id="empty">Nenhuma roda encontrada. Tente outro nome ou categoria.</div>
  </main>

  <footer>
    <div class="wrap">Rodas Garage · Catálogo visual</div>
  </footer>

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");

    const categorias = [...new Set(rodas.map(roda => roda.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
    categorias.forEach(nome => {
      const option = document.createElement("option");
      option.value = nome;
      option.textContent = nome;
      category.appendChild(option);
    });

    function render() {
      const termo = search.value.trim().toLocaleLowerCase("pt-BR");
      const filtro = category.value;
      const filtradas = rodas.filter(roda => {
        const correspondeNome = roda.nome.toLocaleLowerCase("pt-BR").includes(termo);
        const correspondeCategoria = filtro === "todas" || roda.categoria === filtro;
        return correspondeNome && correspondeCategoria;
      });

      grid.replaceChildren();
      filtradas.forEach(roda => {
        const card = document.createElement("article");
        card.className = "card";

        const photo = document.createElement("div");
        photo.className = "photo";
        const img = document.createElement("img");
        img.src = roda.imagem;
        img.alt = roda.nome;
        img.loading = "lazy";
        img.onerror = () => {
          img.remove();
          const placeholder = document.createElement("div");
          placeholder.className = "placeholder";
          placeholder.textContent = "Foto não encontrada. Confira o caminho em imagens/.";
          photo.appendChild(placeholder);
        };
        photo.appendChild(img);

        const info = document.createElement("div");
        info.className = "info";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = roda.categoria || "Sem categoria";
        const title = document.createElement("h2");
        title.textContent = roda.nome;
        info.append(tag, title);
        if (roda.descricao) {
          const desc = document.createElement("p");
          desc.className = "description";
          desc.textContent = roda.descricao;
          info.appendChild(desc);
        }
        card.append(photo, info);
        grid.appendChild(card);
      });

      count.textContent = `${filtradas.length} ${filtradas.length === 1 ? "roda" : "rodas"}`;
      empty.style.display = filtradas.length ? "none" : "block";
    }

    search.addEventListener("input", render);
    category.addEventListener("change", render);
    render();
  </script>
